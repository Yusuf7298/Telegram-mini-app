name: Frontend Runtime Validation

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

jobs:
  runtime-validation:
    name: Runtime validation (Playwright)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        working-directory: frontends
        run: |
          npm ci

      - name: Install Playwright browsers
        working-directory: frontends
        run: npx playwright install --with-deps

      - name: Build frontend
        working-directory: frontends
        run: |
          # Build if project has a build step; skip if not present
          if npm run | grep -q " build"; then
            npm run build --if-present
          fi

      - name: Run Playwright runtime validation
        working-directory: frontends
        env:
          CI: true
          PLAYWRIGHT_HEADLESS: '1'
        run: |
          # Fail on any test failure, console errors, or duplicate API calls (detected by fixtures)
          npx playwright test --config=playwright.config.ts --reporter=dot

      - name: Upload Playwright report (if any)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontends/playwright-report

    outputs:
      result: ${{ steps.run-playwright-runtime-validation.outcome }}
