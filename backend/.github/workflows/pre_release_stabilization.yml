name: Pre-Release Stabilization

on:
  pull_request:
    branches: [main, release/*]
  push:
    branches: [main, release/*]

jobs:
  stabilization:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Use Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18
      - name: Install dependencies
        run: npm ci
      - name: Run ESLint pre-release rules
        run: npx eslint -c .eslintrc.pre-release.js src/**/*.ts || exit 1
      - name: Run pre-release stabilization script
        run: node scripts/pre_release_stabilization_check.js
